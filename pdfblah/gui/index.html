<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdfblah (local)</title>
<link rel="stylesheet" href="/app.css">
<style>
  :root{ --primary:#ff6a3e; --head:#1a1a1a; --body:#4e4b66; --muted:#8b8799; --cream:#fffcf3; --line:#efe4de; --peach:#fef5f4; }
  html,body{ margin:0; background:var(--cream); color:var(--body); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; }
  main{ max-width:840px; margin:0 auto; padding:26px 22px 60px; }
  .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .brand{ font-size:20px; font-weight:800; letter-spacing:-.03em; color:var(--head); }
  .brand span{ color:var(--primary); }
  .local{ font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--primary); background:var(--peach); border-radius:999px; padding:4px 11px; }
  footer{ margin-top:34px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="top"><div class="brand">pdf<span>blah</span></div><span class="local">Local · nothing is uploaded</span></div>
  <div id="app"></div>
  <footer>Everything runs on your machine. Close the terminal window to stop the app. Open source, MIT licensed.</footer>
</main>
<script type="module">
import { mountApp } from "/app.js";
const fileToB64 = (f)=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",",2)[1]||""); r.onerror=rej; r.readAsDataURL(f); });
async function postJSON(path, payload){
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload) });
  return await r.json();
}
const host = {
  maxBytes: 1024*1024*1024, maxPages: 5000, maxRules: 1000, editLabel: "Edit &amp; save",
  async analyze(file, hooks){ hooks.onProgress(100); hooks.onUploaded(); return await postJSON("/analyze", { pdf: await fileToB64(file) }); },
  post(path, payload){ return postJSON(path, payload); },
  downloadUrl(fileId){ return "/download/" + fileId; },
};
mountApp(document.querySelector("#app"), host);
</script>
</body>
</html>
